<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050207">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="TikDev turns GitHub discovery into a fast, swipeable feed of open-source projects.">
  <link id="canonicalUrl" rel="canonical" href="">
  <meta name="keywords" content="GitHub, open source, developers, repositories, programming, project discovery">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TikDev — Swipe Through Open Source">
  <meta property="og:description" content="Discover useful GitHub repositories in a fast, mobile-first feed.">
  <meta id="openGraphUrl" property="og:url" content="">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TikDev — Swipe Through Open Source">
  <meta name="twitter:description" content="Discover useful GitHub repositories in a fast, mobile-first feed.">
  <title>TikDev — Swipe Through Open Source</title>
  <style>
    :root {
      --bg: #080a0f;
      --surface: rgba(17, 20, 29, .82);
      --surface-solid: #11141d;
      --surface-2: #181c27;
      --text: #f7f8fb;
      --muted: #a0a8b8;
      --faint: #697184;
      --line: rgba(255, 255, 255, .10);
      --primary: #7c5cff;
      --primary-2: #21d4fd;
      --positive: #4ade80;
      --warning: #facc15;
      --danger: #fb7185;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
      --header-h: 72px;
      --radius: 24px;
    }

    html[data-theme="light"] {
      --bg: #f4f6fb;
      --surface: rgba(255, 255, 255, .88);
      --surface-solid: #ffffff;
      --surface-2: #eef1f7;
      --text: #10131b;
      --muted: #596174;
      --faint: #8790a2;
      --line: rgba(15, 23, 42, .11);
      --shadow: 0 24px 70px rgba(30, 41, 59, .14);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 300px;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(124, 92, 255, .16), transparent 28rem),
        radial-gradient(circle at 90% 80%, rgba(33, 212, 253, .10), transparent 28rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input, a { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: inherit; }
    ::selection { background: rgba(124, 92, 255, .35); }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 1000;
      padding: 12px 16px;
      color: white;
      background: #111827;
      border-radius: 12px;
    }
    .skip-link:focus { top: 12px; }

    .app-header {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      height: var(--header-h);
      padding: max(10px, env(safe-area-inset-top)) clamp(12px, 3vw, 28px) 10px;
      display: grid;
      grid-template-columns: auto minmax(180px, 620px) auto;
      align-items: center;
      gap: 18px;
      background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 94%, transparent), color-mix(in srgb, var(--bg) 76%, transparent));
      backdrop-filter: blur(22px) saturate(140%);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: -.045em;
      font-size: clamp(1.25rem, 3vw, 1.7rem);
    }

    .brand-mark {
      position: relative;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 8px 24px rgba(124, 92, 255, .28);
      transform: rotate(-4deg);
    }

    .brand-mark::after {
      content: "<>";
      font: 800 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: -2px;
      transform: rotate(4deg);
    }

    .search-form {
      width: 100%;
      position: relative;
    }

    .search-form svg {
      position: absolute;
      left: 15px;
      top: 50%;
      width: 18px;
      height: 18px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 44px;
      padding: 0 46px 0 44px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .search-input::placeholder { color: var(--faint); }
    .search-input:focus {
      border-color: color-mix(in srgb, var(--primary) 75%, white 5%);
      box-shadow: 0 0 0 4px rgba(124, 92, 255, .13);
      background: var(--surface-solid);
    }

    .search-submit {
      position: absolute;
      right: 5px;
      top: 5px;
      height: 34px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--primary), #6545ef);
      cursor: pointer;
      font-weight: 750;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-button {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 50%;
      cursor: pointer;
      transition: transform .2s, color .2s, border-color .2s, background .2s;
    }
    .icon-button:hover, .icon-button:focus-visible {
      color: var(--text);
      background: var(--surface-2);
      border-color: rgba(124, 92, 255, .48);
      transform: translateY(-1px);
      outline: none;
    }
    .icon-button svg { width: 20px; height: 20px; }

    .mode-bar {
      position: fixed;
      z-index: 45;
      top: var(--header-h);
      left: 0;
      right: 0;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .mode-bar::-webkit-scrollbar { display: none; }

    .mode-button {
      flex: 0 0 auto;
      height: 34px;
      padding: 0 15px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-size: .88rem;
      font-weight: 720;
    }
    .mode-button:hover { color: var(--text); background: var(--surface); }
    .mode-button.active {
      color: white;
      background: linear-gradient(135deg, var(--primary), #6545ef);
      box-shadow: 0 8px 24px rgba(124, 92, 255, .2);
    }

    .topic-status {
      flex: 0 0 auto;
      max-width: min(42vw, 300px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--faint);
      font-size: .82rem;
      padding-left: 8px;
    }

    .feed {
      position: fixed;
      inset: calc(var(--header-h) + 50px) 0 0;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      overscroll-behavior-y: contain;
      scrollbar-width: thin;
      scrollbar-color: rgba(124, 92, 255, .55) transparent;
    }

    .feed-card {
      min-height: calc(100dvh - var(--header-h) - 50px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 32px);
      position: relative;
    }

    .feed-card::before {
      content: "";
      position: absolute;
      inset: 10% 8%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow, rgba(124, 92, 255, .10)), transparent 68%);
      filter: blur(22px);
      pointer-events: none;
    }

    .repo-shell {
      position: relative;
      width: min(1120px, 100%);
      min-height: min(690px, calc(100dvh - var(--header-h) - 90px));
      max-height: calc(100dvh - var(--header-h) - 78px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 86px;
      overflow: hidden;
      background: linear-gradient(145deg, color-mix(in srgb, var(--surface-solid) 94%, var(--primary) 6%), var(--surface));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .repo-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(110deg, rgba(255,255,255,.055), transparent 34%);
      z-index: -1;
    }

    .repo-main {
      min-width: 0;
      padding: clamp(22px, 4vw, 52px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .repo-topline {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      object-fit: cover;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: var(--surface-2);
    }

    .owner-block { min-width: 0; }
    .owner-name {
      display: block;
      color: var(--muted);
      font: 650 .88rem/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .updated { color: var(--faint); font-size: .76rem; }

    .repo-title {
      margin: 0;
      max-width: 900px;
      font-size: clamp(2.1rem, 6vw, 5.6rem);
      line-height: .96;
      letter-spacing: -.06em;
      overflow-wrap: anywhere;
    }

    .repo-description {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.3rem);
      line-height: 1.6;
    }

    .repo-meta, .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 31px;
      padding: 5px 11px;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: .79rem;
      line-height: 1;
    }

    .language-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--lang, #8b95a7);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--lang, #8b95a7) 22%, transparent);
    }

    .topic-pill {
      border: 0;
      cursor: pointer;
      transition: color .18s, border-color .18s, transform .18s;
    }
    .topic-pill:hover { color: var(--text); transform: translateY(-1px); }

    .card-spacer { flex: 1; min-height: 8px; }

    .repo-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .primary-link, .secondary-button {
      min-height: 45px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 18px;
      border-radius: 13px;
      text-decoration: none;
      font-weight: 780;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
    }

    .primary-link {
      color: white;
      border: 0;
      background: linear-gradient(135deg, var(--primary), #6545ef);
      box-shadow: 0 12px 30px rgba(124, 92, 255, .22);
    }
    .primary-link:hover { transform: translateY(-2px); box-shadow: 0 15px 34px rgba(124, 92, 255, .32); }

    .secondary-button {
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
    }
    .secondary-button:hover { border-color: rgba(124, 92, 255, .48); transform: translateY(-1px); }
    .primary-link svg, .secondary-button svg { width: 18px; height: 18px; }

    .side-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px 10px;
      border-left: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-2) 55%, transparent);
    }

    .stat-action {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: .73rem;
      font-weight: 700;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      cursor: pointer;
      transition: color .2s, transform .2s, border-color .2s, background .2s;
    }
    .stat-action:hover .stat-icon, .stat-icon:hover {
      color: var(--text);
      transform: translateY(-2px) scale(1.02);
      border-color: rgba(124, 92, 255, .48);
      background: var(--surface-solid);
    }
    .stat-icon svg { width: 23px; height: 23px; }
    .star-icon { color: var(--warning); }
    .fork-icon { color: var(--primary-2); }

    .intro-card .repo-shell {
      grid-template-columns: 1fr;
      text-align: center;
    }
    .intro-card .repo-main { align-items: center; justify-content: center; }
    .intro-card .repo-description { max-width: 690px; }
    .intro-card .repo-actions { justify-content: center; }
    .eyebrow {
      color: var(--primary-2);
      font: 760 .78rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface-2), color-mix(in srgb, var(--surface-2) 60%, white 7%), var(--surface-2));
      background-size: 220% 100%;
      animation: shimmer 1.3s infinite linear;
      border-radius: 12px;
    }
    @keyframes shimmer { to { background-position: -220% 0; } }

    .status-card .repo-main { justify-content: center; align-items: flex-start; }
    .status-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      color: var(--primary-2);
      background: rgba(33, 212, 253, .09);
      border: 1px solid rgba(33, 212, 253, .25);
      border-radius: 18px;
    }
    .status-icon svg { width: 28px; height: 28px; }

    .position-indicator {
      position: fixed;
      z-index: 40;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      padding: 8px 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      font: 700 .74rem/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      pointer-events: none;
    }

    dialog {
      width: min(720px, calc(100% - 24px));
      max-height: min(760px, calc(100dvh - 24px));
      padding: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .66); backdrop-filter: blur(8px); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
    }
    .modal-header h2 { margin: 0; font-size: 1.2rem; }
    .modal-body { padding: 22px 24px 26px; overflow-y: auto; max-height: calc(100dvh - 140px); }
    .modal-copy { margin: 0 0 18px; color: var(--muted); line-height: 1.55; }
    .topic-grid { display: flex; flex-wrap: wrap; gap: 9px; }

    .topic-choice {
      min-height: 38px;
      padding: 7px 13px;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      font-size: .86rem;
    }
    .topic-choice:hover { color: var(--text); border-color: rgba(124, 92, 255, .45); }
    .topic-choice.selected {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--primary), #6545ef);
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 22px;
    }
    .text-button {
      padding: 10px;
      color: var(--muted);
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .text-button:hover { color: var(--text); }

    .readme-dialog { width: min(900px, calc(100% - 24px)); }
    .readme-meta { color: var(--muted); font-size: .82rem; }
    .readme-content {
      margin: 0;
      min-height: 220px;
      max-height: calc(100dvh - 190px);
      padding: 22px 24px 30px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--text);
      background: var(--surface-solid);
      font: 400 .88rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .toast {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: max(26px, env(safe-area-inset-bottom));
      max-width: calc(100% - 32px);
      padding: 11px 15px;
      color: white;
      background: #171a24;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,.35);
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition: opacity .22s, transform .22s;
      font-size: .86rem;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      :root { --header-h: 64px; }
      .app-header {
        grid-template-columns: auto 1fr auto;
        gap: 9px;
        padding-left: 10px;
        padding-right: 10px;
      }
      .brand-text { display: none; }
      .brand-mark { width: 38px; height: 38px; }
      .search-submit { display: none; }
      .search-input { padding-right: 15px; }
      .header-actions .icon-button:first-child { display: none; }
      .mode-bar { justify-content: flex-start; }
      .topic-status { display: none; }
      .feed-card { padding: 10px; }
      .repo-shell {
        min-height: calc(100dvh - var(--header-h) - 70px);
        max-height: calc(100dvh - var(--header-h) - 70px);
        grid-template-columns: 1fr;
        border-radius: 19px;
      }
      .repo-main {
        padding: 23px 21px 104px;
        gap: 18px;
        overflow-y: auto;
      }
      .repo-title { font-size: clamp(2.2rem, 13vw, 4.3rem); }
      .repo-description { font-size: .98rem; }
      .side-actions {
        position: absolute;
        right: 13px;
        bottom: 96px;
        gap: 14px;
        padding: 0;
        border: 0;
        background: transparent;
      }
      .stat-icon { width: 44px; height: 44px; background: rgba(10,12,18,.72); color: white; }
      html[data-theme="light"] .stat-icon { background: rgba(255,255,255,.84); color: #10131b; }
      .stat-action > span:last-child { color: var(--text); text-shadow: 0 1px 10px var(--bg); }
      .repo-actions {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 20px;
        padding-right: 0;
      }
      .primary-link { flex: 1 1 auto; }
      .secondary-button { padding: 0 14px; }
      .secondary-button .button-label { display: none; }
      .position-indicator { display: none; }
      .intro-card .repo-main { padding-bottom: 28px; }
      .intro-card .repo-actions { position: static; padding-right: 0; }
    }

    @media (max-width: 400px) {
      .mode-button { padding: 0 12px; }
      .repo-main { padding-left: 18px; padding-right: 18px; }
      .repo-title { font-size: clamp(2rem, 12vw, 3.5rem); }
      .pill:nth-child(n+4), .topic-pill:nth-child(n+4) { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }


    /* DedSec Project visual system and adaptive layout */
    :root {
      --bg: #050207;
      --bg-soft: #0d0712;
      --surface: rgba(17, 9, 24, .88);
      --surface-solid: #100817;
      --surface-2: #1b1024;
      --text: #f8f5fb;
      --muted: #b9afc4;
      --faint: #81758d;
      --line: rgba(181, 88, 255, .22);
      --primary: #8d2de2;
      --primary-strong: #6f16b8;
      --primary-2: #39d779;
      --positive: #39d779;
      --warning: #ffd166;
      --danger: #ff496d;
      --shadow: 0 28px 90px rgba(0, 0, 0, .58), 0 0 0 1px rgba(141, 45, 226, .08);
      --header-h: 76px;
      --mode-h: 54px;
      --radius: clamp(18px, 2vw, 28px);
      --content-max: 1380px;
    }

    html[data-theme="light"] {
      --bg: #f7f4fb;
      --bg-soft: #eee7f5;
      --surface: rgba(255, 255, 255, .92);
      --surface-solid: #ffffff;
      --surface-2: #eee8f4;
      --text: #160f1c;
      --muted: #5f536b;
      --faint: #85778f;
      --line: rgba(77, 28, 103, .17);

      Kotlin: '#A97BFF', Swift: '#F05138', Go: '#00ADD8', Rust: '#dea584', C: '#555555',
      'C++': '#f34b7d', 'C#': '#178600', PHP: '#4F5D95', Ruby: '#701516', Dart: '#00B4AB',
      Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c', Svelte: '#ff3e00', Vue: '#41b883'
    };

    const icons = {
      external: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>',
      book: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"></path><path d="M8 7h8M8 11h6"></path></svg>',
      star: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.2L5.8 21 7 14.2l-5-4.9 6.9-1L12 2Z"></path></svg>',
      fork: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="4" r="2"></circle><circle cx="18" cy="4" r="2"></circle><circle cx="12" cy="20" r="2"></circle><path d="M6 6v3c0 2 2 3 6 3s6-1 6-3V6M12 12v6"></path></svg>',
      share: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"></path></svg>',
      bookmark: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4V3Z"></path></svg>',
      refresh: '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6v5h-5M4 18v-5h5"></path><path d="M18.5 9A7 7 0 0 0 6 6.5L4 11M5.5 15A7 7 0 0 0 18 17.5l2-4.5"></path></svg>',

    };

    const state = {
      mode: 'discover',
      query: '',
      page: 1,
      loading: false,
      exhausted: false,
      repositories: [],
      seen: new Set(),
      selectedTopics: new Set(readJson('tikdev-topics', [])),
      draftTopics: new Set(),
      saved: new Set(readJson('tikdev-saved', [])),
      activeIndex: 0,
      topicCursor: 0,
      requestId: 0
    };

    const feed = document.getElementById('feed');
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const topicStatus = document.getElementById('topicStatus');
    const positionIndicator = document.getElementById('positionIndicator');
    const topicsDialog = document.getElementById('topicsDialog');
    const topicGrid = document.getElementById('topicGrid');
    const readmeDialog = document.getElementById('readmeDialog');
    const readmeTitle = document.getElementById('readmeTitle');
    const readmeMeta = document.getElementById('readmeMeta');
    const readmeContent = document.getElementById('readmeContent');
    const toast = document.getElementById('toast');
    const sourceRepositoryLink = document.getElementById('sourceRepositoryLink');
    const canonicalUrl = document.getElementById('canonicalUrl');
    const openGraphUrl = document.getElementById('openGraphUrl');

    function injectedValue(value) {
      const text = String(value || '').trim();
      return /^__TIKDEV_[A-Z_]+__$/.test(text) ? '' : text;
    }

    function validRepository(value) {
      return /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?\/[A-Za-z0-9._-]{1,100}$/.test(value);
    }

    function normalizeSiteUrl(value) {
      try {
        const url = new URL(value);
        if (!['http:', 'https:'].includes(url.protocol)) return '';
        url.hash = '';
        url.search = '';
        if (!url.pathname.endsWith('/')) url.pathname += '/';
        return url.href;
      } catch { return ''; }
    }

    function inferGithubPagesRepository() {
      const host = location.hostname.toLowerCase();
      if (!host.endsWith('.github.io')) return '';
      const owner = host.slice(0, -'.github.io'.length);
      if (!owner) return '';
      const firstPathPart = location.pathname.split('/').filter(Boolean)[0];
      const repository = firstPathPart || `${owner}.github.io`;
      return `${owner}/${repository}`;
    }

    function inferCurrentSiteUrl(repository) {
      if (!['http:', 'https:'].includes(location.protocol)) return '';
      const host = location.hostname.toLowerCase();
      if (!host.endsWith('.github.io')) return `${location.origin}/`;

      const [owner, repositoryName] = String(repository || '').split('/');
      if (!owner || !repositoryName) return `${location.origin}/`;
      const isAccountSite = repositoryName.toLowerCase() === `${owner}.github.io`.toLowerCase();
      return isAccountSite ? `${location.origin}/` : `${location.origin}/${repositoryName}/`;
    }

    const injectedRepository = injectedValue(DEPLOYMENT.repository);
    const REPOSITORY = validRepository(injectedRepository)
      ? injectedRepository
      : (inferGithubPagesRepository() || ORIGINAL_REPOSITORY);
    let SITE_URL = normalizeSiteUrl(injectedValue(DEPLOYMENT.siteUrl)) || inferCurrentSiteUrl(REPOSITORY);
    let CUSTOM_DOMAIN = injectedValue(DEPLOYMENT.customDomain);

    function applyDeploymentMetadata() {
      const repositoryUrl = `https://github.com/${REPOSITORY}`;
      sourceRepositoryLink.href = repositoryUrl;
      sourceRepositoryLink.setAttribute('aria-label', `Open ${REPOSITORY} on GitHub`);
      sourceRepositoryLink.title = REPOSITORY;

      if (SITE_URL) {
        canonicalUrl.href = SITE_URL;
        openGraphUrl.setAttribute('content', SITE_URL);
      }

      window.__TIKDEV_SITE__ = Object.freeze({
        repository: REPOSITORY,
        repositoryUrl,
        siteUrl: SITE_URL,
        customDomain: CUSTOM_DOMAIN || null
      });
    }

    function validCname(value) {
      const domain = String(value || '').trim().toLowerCase().replace(/\.$/, '');
      return /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])$/.test(domain)
        ? domain
        : '';
    }

    async function detectPublishedCname() {
      const injectedCname = validCname(CUSTOM_DOMAIN);
      if (injectedCname) {
        CUSTOM_DOMAIN = injectedCname;
        SITE_URL = `https://${injectedCname}/`;
        applyDeploymentMetadata();
        return;
      }

      try {
        const cnameUrl = new URL('CNAME', SITE_URL || document.baseURI);
        const response = await fetch(cnameUrl, { cache: 'no-store', headers: { Accept: 'text/plain' } });
        if (!response.ok) return;
        const detected = validCname((await response.text()).split(/\r?\n/, 1)[0]);
        if (!detected) return;
        CUSTOM_DOMAIN = detected;
        SITE_URL = `https://${detected}/`;
        applyDeploymentMetadata();
      } catch { /* CNAME is optional */ }
    }

    applyDeploymentMetadata();
    detectPublishedCname();

    function readJson(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value : fallback;
      } catch { return fallback; }
    }

    function writeJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ }
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[char]);
    }

    function safeGithubUrl(value, fallback = 'https://github.com') {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' && (url.hostname === 'github.com' || url.hostname.endsWith('.github.com'))
          ? url.href : fallback;
      } catch { return fallback; }
    }

    function formatNumber(value) {
      return new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(value || 0);
    }

    function relativeDate(dateValue) {
      const time = new Date(dateValue).getTime();
      if (!Number.isFinite(time)) return 'Recently updated';
      const seconds = Math.max(1, Math.floor((Date.now() - time) / 1000));
      const units = [
        ['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]
      ];
      for (const [unit, amount] of units) {
        if (seconds >= amount) return new Intl.RelativeTimeFormat('en', { numeric: 'auto' }).format(-Math.floor(seconds / amount), unit);
      }
      return 'just now';
    }

    function dateDaysAgo(days) {
      const date = new Date();
      date.setUTCDate(date.getUTCDate() - days);
      return date.toISOString().slice(0, 10);
    }

    function updateTopicStatus() {
      const topics = [...state.selectedTopics];
      topicStatus.textContent = topics.length ? topics.map(prettyTopic).join(' · ') : 'All development topics';
    }

    function prettyTopic(topic) {
      return String(topic).replace(/-/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
    }

    function setMode(mode) {
      if (!['discover', 'popular', 'fresh', 'saved'].includes(mode)) return;
      state.mode = mode;
      document.querySelectorAll('.mode-button').forEach(button => {
        button.classList.toggle('active', button.dataset.mode === mode);
      });
      resetAndLoad();
    }

    function buildSearch() {
      const topicList = [...state.selectedTopics];
      const chosenTopic = topicList.length ? topicList[state.topicCursor++ % topicList.length] : '';
      const userQuery = state.query.trim().replace(/[<>]/g, ' ').slice(0, 100);
      let qualifiers = 'fork:false archived:false';
      let sort = 'stars';

      if (state.mode === 'popular') {
        qualifiers += ' stars:>1000';
      } else if (state.mode === 'fresh') {
        qualifiers += ` created:>=${dateDaysAgo(120)} stars:>3`;
        sort = 'updated';
      } else {
        qualifiers += ` pushed:>=${dateDaysAgo(365)} stars:>25`;
      }

      if (chosenTopic) qualifiers += ` topic:${chosenTopic}`;
      const q = [userQuery, qualifiers].filter(Boolean).join(' ');
      return `${API}/search/repositories?q=${encodeURIComponent(q)}&sort=${sort}&order=desc&per_page=${PAGE_SIZE}&page=${state.page}`;
    }

    function introCard() {
      return `
        <section class="feed-card intro-card" data-kind="intro" aria-label="Welcome to TikDev">
          <article class="repo-shell">
            <div class="repo-main">
              <span class="eyebrow">Open-source discovery, simplified</span>
              <h1 class="repo-title">Swipe less.<br>Discover more.</h1>
              <p class="repo-description">TikDev turns public GitHub repositories into a clean, vertical feed. Search directly, choose topics, save interesting projects, and open their README without leaving the page.</p>
              <div class="repo-actions">
                <button class="primary-link" type="button" data-action="next">Start exploring ${icons.external}</button>
                <button class="secondary-button" type="button" data-action="open-topics">Choose topics</button>
              </div>
            </div>
          </article>
        </section>`;
    }

    function loadingCard() {
      return `
        <section class="feed-card status-card" data-kind="loading" aria-label="Loading repositories">
          <article class="repo-shell">
            <div class="repo-main">
              <div class="skeleton" style="width:44px;height:44px"></div>
              <div class="skeleton" style="width:min(78%,620px);height:74px"></div>
              <div class="skeleton" style="width:min(92%,760px);height:22px"></div>
              <div class="skeleton" style="width:min(70%,560px);height:22px"></div>
              <div class="card-spacer"></div>
              <div class="skeleton" style="width:180px;height:45px"></div>
            </div>
          </article>
        </section>`;
    }

    function messageCard(title, message, actionLabel = 'Try again') {
      return `
        <section class="feed-card status-card" data-kind="message">
          <article class="repo-shell">
            <div class="repo-main">
              <div class="status-icon">${icons.alert}</div>
              <h1 class="repo-title" style="font-size:clamp(2rem,5vw,4rem)">${escapeHtml(title)}</h1>
              <p class="repo-description">${escapeHtml(message)}</p>
              <div class="repo-actions">
                <button class="primary-link" type="button" data-action="retry">${escapeHtml(actionLabel)} ${icons.refresh}</button>
              </div>
            </div>
          </article>
        </section>`;
    }

    function repoCard(repo) {
      const fullName = escapeHtml(repo.full_name);
      const repoUrl = safeGithubUrl(repo.html_url);
      const starUrl = `${repoUrl}/stargazers`;
      const forkUrl = `${repoUrl}/fork`;
      const language = repo.language ? escapeHtml(repo.language) : 'Unknown';
      const langColor = LANGUAGE_COLORS[repo.language] || '#8b95a7';
      const topics = (repo.topics || []).slice(0, 6);
      const isSaved = state.saved.has(repo.full_name);
      const license = repo.license && repo.license.spdx_id && repo.license.spdx_id !== 'NOASSERTION' ? repo.license.spdx_id : null;
      const homepage = repo.homepage && /^https:\/\//i.test(repo.homepage) ? repo.homepage : null;

      return `
        <section class="feed-card" data-kind="repo" data-repo="${fullName}">
          <article class="repo-shell">
            <div class="repo-main">
              <div class="repo-topline">
                <img class="avatar" src="${escapeHtml(repo.owner.avatar_url)}" alt="" width="44" height="44" loading="lazy">
                <div class="owner-block">
                  <span class="owner-name">${escapeHtml(repo.owner.login)} /</span>
                  <span class="updated">Updated ${escapeHtml(relativeDate(repo.pushed_at || repo.updated_at))}</span>
                </div>
              </div>

              <h2 class="repo-title">${escapeHtml(repo.name)}</h2>
              <p class="repo-description">${escapeHtml(repo.description || 'No repository description has been provided yet.')}</p>

              <div class="repo-meta">
                <span class="pill"><span class="language-dot" style="--lang:${langColor}"></span>${language}</span>
                ${license ? `<span class="pill">${escapeHtml(license)}</span>` : ''}
                ${repo.open_issues_count ? `<span class="pill">${formatNumber(repo.open_issues_count)} open issues</span>` : ''}
                ${homepage ? `<a class="pill" href="${escapeHtml(homepage)}" target="_blank" rel="noopener noreferrer">Website ↗</a>` : ''}
              </div>

              ${topics.length ? `<div class="topics">${topics.map(topic => `<button class="pill topic-pill" type="button" data-action="topic" data-topic="${escapeHtml(topic)}">#${escapeHtml(topic)}</button>`).join('')}</div>` : ''}

              <div class="card-spacer"></div>

              <div class="repo-actions">
                <a class="primary-link" href="${repoUrl}" target="_blank" rel="noopener noreferrer">Open repository ${icons.external}</a>
                <button class="secondary-button" type="button" data-action="readme" data-repo="${fullName}">${icons.book}<span class="button-label">README</span></button>
                <button class="secondary-button" type="button" data-action="save" data-repo="${fullName}" aria-pressed="${isSaved}">${icons.bookmark}<span class="button-label">${isSaved ? 'Saved' : 'Save'}</span></button>
              </div>
            </div>

            <aside class="side-actions" aria-label="Repository actions">
              <a class="stat-action" href="${starUrl}" target="_blank" rel="noopener noreferrer" aria-label="View ${repo.stargazers_count} stars">
                <span class="stat-icon star-icon">${icons.star}</span>
                <span>${formatNumber(repo.stargazers_count)}</span>
              </a>
              <a class="stat-action" href="${forkUrl}" target="_blank" rel="noopener noreferrer" aria-label="Fork repository; ${repo.forks_count} forks">
                <span class="stat-icon fork-icon">${icons.fork}</span>
                <span>${formatNumber(repo.forks_count)}</span>
              </a>
              <button class="stat-action" type="button" data-action="share" data-repo="${fullName}" aria-label="Share ${escapeHtml(repo.name)}">
                <span class="stat-icon">${icons.share}</span>
                <span>Share</span>
              </button>
            </aside>
          </article>
        </section>`;
    }

    function renderInitial() {
      feed.innerHTML = introCard() + loadingCard();
      observeCards();
      updatePosition();
    }

    function renderSaved() {
      const savedRepos = state.repositories.filter(repo => state.saved.has(repo.full_name));
      const cached = readJson('tikdev-saved-repos', []).filter(repo => state.saved.has(repo.full_name));
      const combined = [...savedRepos, ...cached.filter(repo => !savedRepos.some(item => item.full_name === repo.full_name))];
      state.repositories = combined;
      feed.innerHTML = introCard() + (combined.length
        ? combined.map(repoCard).join('')
        : messageCard('Nothing saved yet', 'Save repositories from Discover, Popular, or Fresh and they will appear here.', 'Browse projects'));
      observeCards();
      updatePosition();
    }

    async function resetAndLoad() {
      state.requestId += 1;
      state.page = 1;
      state.loading = false;
      state.exhausted = false;
      state.repositories = [];
      state.seen.clear();
      state.activeIndex = 0;
      feed.scrollTo({ top: 0, behavior: 'instant' });

      if (state.mode === 'saved') {
        renderSaved();
        return;
      }

      renderInitial();
      await loadMore(true, state.requestId);
    }

    async function loadMore(replaceLoading = false, requestId = state.requestId) {
      if (state.loading || state.exhausted || state.mode === 'saved') return;
      state.loading = true;

      try {
        const response = await fetch(buildSearch(), {
          headers: { Accept: 'application/vnd.github+json' }
        });

        if (requestId !== state.requestId) return;

        if (!response.ok) {
          if (response.status === 403) {
            const reset = response.headers.get('x-ratelimit-reset');
            const resetText = reset ? new Date(Number(reset) * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : 'a few minutes';
            throw new Error(`GitHub's public API limit was reached. Try again after ${resetText}.`);
          }
          if (response.status === 422) throw new Error('GitHub could not understand that search. Try fewer or simpler words.');
          throw new Error(`GitHub returned error ${response.status}.`);
        }

        const data = await response.json();
        const items = (data.items || []).filter(repo => !state.seen.has(repo.full_name));
        items.forEach(repo => state.seen.add(repo.full_name));
        state.repositories.push(...items);
        state.exhausted = items.length < PAGE_SIZE || state.repositories.length >= Math.min(data.total_count || 1000, 1000);
        state.page += 1;

        const loadingNode = feed.querySelector('[data-kind="loading"]');
        if (loadingNode) loadingNode.remove();

        if (!state.repositories.length) {
          feed.insertAdjacentHTML('beforeend', messageCard('No projects found', 'Try another search or clear some topic filters.', 'Clear search'));
        } else {
          const fragment = document.createElement('div');
          fragment.innerHTML = items.map(repoCard).join('');
          while (fragment.firstElementChild) feed.appendChild(fragment.firstElementChild);
          if (!state.exhausted) feed.insertAdjacentHTML('beforeend', loadingCard());
        }

        observeCards();
        updatePosition();
      } catch (error) {
        if (requestId !== state.requestId) return;
        const loadingNode = feed.querySelector('[data-kind="loading"]');
        if (loadingNode) loadingNode.outerHTML = messageCard('Could not load GitHub', error.message || 'Check your connection and try again.');
        observeCards();
      } finally {
        state.loading = false;
      }
    }

    let observer;
    function observeCards() {
      if (observer) observer.disconnect();
      observer = new IntersectionObserver(entries => {
        for (const entry of entries) {
          if (!entry.isIntersecting || entry.intersectionRatio < .58) continue;
          const cards = [...feed.querySelectorAll('.feed-card')];
          state.activeIndex = cards.indexOf(entry.target);
          updatePosition();
          const loadingIndex = cards.findIndex(card => card.dataset.kind === 'loading');
          if (loadingIndex >= 0 && state.activeIndex >= loadingIndex - 2) loadMore(false, state.requestId);
        }
      }, { root: feed, threshold: [.58] });
      feed.querySelectorAll('.feed-card').forEach(card => observer.observe(card));
    }

    function updatePosition() {
      const cards = [...feed.querySelectorAll('.feed-card')].filter(card => card.dataset.kind !== 'loading');
      const visibleIndex = Math.min(state.activeIndex + 1, Math.max(1, cards.length));
      positionIndicator.textContent = `${visibleIndex} / ${Math.max(1, cards.length)}`;
    }

    function scrollToCard(offset) {
      const cards = [...feed.querySelectorAll('.feed-card')];
      if (!cards.length) return;
      const target = Math.max(0, Math.min(cards.length - 1, state.activeIndex + offset));
      cards[target].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function findRepo(fullName) {
      return state.repositories.find(repo => repo.full_name === fullName)
        || readJson('tikdev-saved-repos', []).find(repo => repo.full_name === fullName);
    }

    async function openReadme(fullName) {
      const repo = findRepo(fullName);
      if (!repo) return;
      readmeTitle.textContent = repo.name;
      readmeMeta.textContent = `${repo.full_name} · default branch: ${repo.default_branch}`;
      readmeContent.textContent = 'Loading README…';
      readmeDialog.showModal();

      try {
        const response = await fetch(`${API}/repos/${encodeURIComponent(repo.owner.login)}/${encodeURIComponent(repo.name)}/readme`, {
          headers: { Accept: 'application/vnd.github+json' }
        });
        if (!response.ok) throw new Error(response.status === 404 ? 'This repository does not have a README.' : `GitHub returned error ${response.status}.`);
        const data = await response.json();
        const cleanBase64 = String(data.content || '').replace(/\s/g, '');
        const bytes = Uint8Array.from(atob(cleanBase64), char => char.charCodeAt(0));
        const text = new TextDecoder().decode(bytes);
        readmeContent.textContent = text.slice(0, 80000) || 'The README is empty.';
      } catch (error) {
        readmeContent.textContent = error.message || 'Could not load this README.';
      }
    }

    function saveRepo(fullName) {
      const repo = findRepo(fullName);
      if (!repo) return;
      if (state.saved.has(fullName)) {
        state.saved.delete(fullName);
        showToast('Removed from saved projects');
      } else {
        state.saved.add(fullName);
        showToast('Saved in this browser');
      }
      writeJson('tikdev-saved', [...state.saved]);
      const cached = readJson('tikdev-saved-repos', []).filter(item => item.full_name !== fullName);
      if (state.saved.has(fullName)) cached.unshift(repo);
      writeJson('tikdev-saved-repos', cached.slice(0, 50));

      document.querySelectorAll(`[data-action="save"][data-repo="${CSS.escape(fullName)}"]`).forEach(button => {
        button.setAttribute('aria-pressed', String(state.saved.has(fullName)));
        const label = button.querySelector('.button-label');
        if (label) label.textContent = state.saved.has(fullName) ? 'Saved' : 'Save';
      });
    }

    async function shareRepo(fullName) {
      const repo = findRepo(fullName);
      if (!repo) return;
      const data = { title: `${repo.full_name} on GitHub`, text: repo.description || `Check out ${repo.full_name}`, url: repo.html_url };
      try {
        if (navigator.share) await navigator.share(data);
        else {
          await navigator.clipboard.writeText(repo.html_url);
          showToast('Repository link copied');
        }
      } catch (error) {
        if (error && error.name !== 'AbortError') showToast('Sharing was not available');
      }
    }

    function renderTopicChoices() {
      topicGrid.innerHTML = TOPICS.map(topic => `
        <button class="topic-choice ${state.draftTopics.has(topic) ? 'selected' : ''}" type="button" data-topic-choice="${topic}" aria-pressed="${state.draftTopics.has(topic)}">${escapeHtml(prettyTopic(topic))}</button>
      `).join('');
    }

    function openTopics() {
      state.draftTopics = new Set(state.selectedTopics);
      renderTopicChoices();
      topicsDialog.showModal();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('visible'), 2200);
    }

    searchForm.addEventListener('submit', event => {
      event.preventDefault();
      state.query = searchInput.value.trim();
      if (state.mode === 'saved') setMode('discover');
      else resetAndLoad();
    });

    document.querySelectorAll('.mode-button').forEach(button => {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    });

    document.getElementById('topicsButton').addEventListener('click', openTopics);
    document.getElementById('clearTopics').addEventListener('click', () => {
      state.draftTopics.clear();
      renderTopicChoices();
    });
    document.getElementById('saveTopics').addEventListener('click', () => {
      state.selectedTopics = new Set(state.draftTopics);
      writeJson('tikdev-topics', [...state.selectedTopics]);
      updateTopicStatus();
      topicsDialog.close();
      if (state.mode === 'saved') setMode('discover');
      else resetAndLoad();
    });

    topicGrid.addEventListener('click', event => {
      const button = event.target.closest('[data-topic-choice]');
      if (!button) return;
      const topic = button.dataset.topicChoice;
      state.draftTopics.has(topic) ? state.draftTopics.delete(topic) : state.draftTopics.add(topic);
      button.classList.toggle('selected', state.draftTopics.has(topic));
      button.setAttribute('aria-pressed', String(state.draftTopics.has(topic)));
    });

    document.querySelectorAll('[data-close]').forEach(button => {
      button.addEventListener('click', () => document.getElementById(button.dataset.close).close());
    });

    [topicsDialog, readmeDialog].forEach(dialog => {
      dialog.addEventListener('click', event => {
        const bounds = dialog.getBoundingClientRect();
        const outside = event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom;
        if (outside) dialog.close();
      });
    });

    feed.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'next') scrollToCard(1);
      else if (action === 'open-topics') openTopics();
      else if (action === 'retry') {
        if (state.query) { state.query = ''; searchInput.value = ''; }
        resetAndLoad();
      }
      else if (action === 'readme') openReadme(target.dataset.repo);
      else if (action === 'save') saveRepo(target.dataset.repo);
      else if (action === 'share') shareRepo(target.dataset.repo);
      else if (action === 'topic') {
        const topic = target.dataset.topic;
        state.selectedTopics = new Set([topic]);
        writeJson('tikdev-topics', [topic]);
        updateTopicStatus();
        state.query = '';
        searchInput.value = '';
        if (state.mode === 'saved') setMode('discover');
        else resetAndLoad();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.target.matches('input, textarea') || topicsDialog.open || readmeDialog.open) return;
      if (['ArrowDown', 'PageDown', 'j', 'J'].includes(event.key)) { event.preventDefault(); scrollToCard(1); }
      if (['ArrowUp', 'PageUp', 'k', 'K'].includes(event.key)) { event.preventDefault(); scrollToCard(-1); }
      if (event.key === '/') { event.preventDefault(); searchInput.focus(); }
    });

    const themeButton = document.getElementById('themeButton');
    const themeIcon = document.getElementById('themeIcon');
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const storedTheme = localStorage.getItem('tikdev-theme');
    const initialTheme = storedTheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeMeta.setAttribute('content', theme === 'dark' ? '#050207' : '#f7f4fb');
      themeButton.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      themeButton.setAttribute('title', theme === 'dark' ? 'Use light theme' : 'Use dark theme');
      themeIcon.innerHTML = theme === 'dark'
        ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>'
        : '<path d="M12 3a9 9 0 1 0 9 9c0-.5-.04-1-.12-1.47A7 7 0 0 1 12 3Z"></path>';
    }

    applyTheme(initialTheme);
    themeButton.addEventListener('click', () => {
      const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(theme);
      localStorage.setItem('tikdev-theme', theme);
    });

    updateTopicStatus();
    renderInitial();
    loadMore(true, state.requestId);
  </script>
</body>
</html>
