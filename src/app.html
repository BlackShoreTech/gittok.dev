<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Route-varying SEO tags are owned by $lib/components/Seo.svelte.
		     Adding them here too would emit a second, duplicate set. -->

		<!-- Viewport and Theme Colors -->
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="theme-color" content="#06070b" />
		<meta name="color-scheme" content="dark" />

		<!-- Speeds up the first GitHub API call and README fetch on the feed -->
		<link rel="preconnect" href="https://api.github.com" />
		<link rel="preconnect" href="https://raw.githubusercontent.com" />

		<!-- Favicon and App Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- README styling is self-hosted in app.css (.readme-content) -->

		%sveltekit.head%
	</head>
	<!-- Google tag (gtag.js) — config lives in /analytics.js so the CSP can
	     stay on script-src 'self' rather than allowing unsafe-inline -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-H3R7JRFG7D"></script>
	<script src="%sveltekit.assets%/analytics.js"></script>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
