<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Primary Meta Tags -->
		<title>Gittok - Discover Trending GitHub Projects</title>
		<meta name="title" content="Gittok - Discover Trending GitHub Projects" />
		<meta
			name="description"
			content="A TikTok-style feed for discovering trending GitHub repositories and topics. Your productive alternative to endless scrolling - learn, discover, and stay updated with the tech world."
		/>

		<!-- Viewport and Theme Colors -->
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta name="theme-color" content="#06070b" />
		<meta name="color-scheme" content="dark" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://gittok.dev" />
		<meta property="og:title" content="Gittok - Discover Trending GitHub Projects" />
		<meta
			property="og:description"
			content="Swipe through trending GitHub repositories and topics in a fun, TikTok-style interface. Turn your scrolling habit into learning opportunities."
		/>
		<meta property="og:image" content="https://gittok.dev/screenshot-1.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://gittok.dev" />
		<meta property="twitter:title" content="Gittok - Trending GitHub Explorer" />
		<meta
			property="twitter:description"
			content="Discover trending GitHub projects in a TikTok-style feed. Make your screen time more productive with curated tech content."
		/>
		<meta property="twitter:image" content="https://gittok.dev/screenshot-1.png" />

		<!-- Keywords -->
		<meta
			name="keywords"
			content="gittok, github trends, programming, coding, developer tools, tech discovery, repositories, open source, software engineering, coding projects, tech learning"
		/>

		<!-- Favicon and App Icons -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- README styling is self-hosted in app.css (.readme-content) -->

		<!-- Robots and Canonical -->
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://gittok.dev/" />

		%sveltekit.head%
	</head>
	<!-- Google tag (gtag.js) — config lives in /analytics.js so the CSP can
	     stay on script-src 'self' rather than allowing unsafe-inline -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-H3R7JRFG7D"></script>
	<script src="%sveltekit.assets%/analytics.js"></script>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
